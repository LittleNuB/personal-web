name: Publish personal website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Download pinned playable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("scripts/playables-release.json"))["tag"])')
          asset=$(python3 -c 'import json; print(json.load(open("scripts/playables-release.json"))["asset"])')
          gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/playables"
      - name: Assemble public files and verify checksum
        run: python3 scripts/build-pages.py --archive "$RUNNER_TEMP/playables/playables-v1.zip" --output dist --base /personal-web/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
